# Pages CMS ayarı: https://app.pagescms.org
# Editörde görünen bölümler ve alanlar. Kaydedilen her değişiklik bu depoya
# commit olarak gider; GitHub Actions siteyi yeniden hazırlayıp yayınlar.
#
# Not: Kategori seçenekleri src/data/taxonomy.json ile aynı olmalıdır.
# İçerik kontrolü (npm run validate:content) iki listeyi karşılaştırır.

media:
  - name: blog_images
    label: Makale görselleri
    input: public/images/blog
    output: /images/blog
    categories:
      - image
    rename: safe
  - name: note_images
    label: Not görselleri
    input: public/images/notes
    output: /images/notes
    categories:
      - image
    rename: safe
  - name: project_images
    label: Proje görselleri
    input: public/images/projects
    output: /images/projects
    categories:
      - image
    rename: safe
  - name: profile_images
    label: Profil fotoğrafı
    input: public/images/profile
    output: /images/profile
    categories:
      - image
    rename: safe
  - name: cv_files
    label: CV dosyası
    input: public/cv
    output: /cv
    extensions:
      - pdf
    rename: safe
content:
  - name: blog
    label: Makaleler
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename:
      template: "{fields.urlSlug}.md"
      field: false
    view:
      fields:
        - title
        - published
        - publishedAt
        - category
        - lang
      primary: title
      sort:
        - publishedAt
        - title
      default:
        sort: publishedAt
        order: desc
    fields:
      - name: title
        label: Başlık
        type: string
        required: true
      - name: urlSlug
        label: Yazı adresi
        type: string
        required: true
        pattern:
          regex: ^[a-z0-9]+(-[a-z0-9]+)*$
          message: Yalnızca küçük harf, rakam ve tire kullan. Örnek spring-boot-controller
        description: Örnek spring-boot-controller. Yazı /blog/spring-boot-controller/ adresinde açılır. Yayınlandıktan sonra değiştirme.
      - name: description
        label: Kısa açıklama
        type: text
        description: Listelerde, aramada ve paylaşımda görünen bir iki cümle. Yayınlamak için gerekli.
      - name: publishedAt
        label: Yayın tarihi
        type: date
        options:
          format: yyyy-MM-dd
      - name: updatedAt
        label: Son düzenleme tarihi
        type: date
        default: ""
        description: Yalnızca yazıda gerçekten önemli bir değişiklik yaptıysan doldur.
        options:
          format: yyyy-MM-dd
      - name: category
        label: Kategori
        type: select
        options:
          placeholder: Kategori seç
          values:
            - name: java
              label: Java
            - name: spring-boot
              label: Spring Boot
            - name: docker
              label: Docker
            - name: genel
              label: Genel
      - name: tags
        label: Etiketler
        type: string
        list: true
      - name: cover
        label: Kapak görseli
        type: image
        options:
          media: blog_images
      - name: coverAlt
        label: Kapak görselinin açıklaması
        type: string
        description: Görmeyen bir okura görseli anlatan kısa cümle. Kapak görseli varsa gerekli.
      - name: lang
        label: İçeriğin dili
        type: select
        default: tr
        description: Yazı ya da notun özgün dili. Arayüz dili içerik dilinden bağımsızdır.
        options:
          values:
            - name: tr
              label: Türkçe
            - name: en
              label: English
      - name: published
        label: Yayında
        type: boolean
        default: false
        description: Kapalıysa taslak. Açıp kaydedince yayınlama işlemi başlar.
      - name: body
        label: Yazının içeriği
        type: rich-text
        options:
          format: markdown
          media: blog_images
          switcher: true
  - name: notes
    label: Öğrenme Notları
    type: collection
    path: src/content/notes
    format: yaml-frontmatter
    filename:
      template: "{fields.urlSlug}.md"
      field: false
    view:
      fields:
        - title
        - published
        - category
        - lang
      primary: title
      sort:
        - title
        - publishedAt
    fields:
      - name: title
        label: Başlık
        type: string
        required: true
      - name: urlSlug
        label: Not adresi
        type: string
        required: true
        pattern:
          regex: ^[a-z0-9]+(-[a-z0-9]+)*$
          message: Yalnızca küçük harf, rakam ve tire kullan. Örnek java-interface
        description: Örnek java-interface. Not /notlar/yerel/java-interface/ adresinde açılır. Yayınlandıktan sonra değiştirme.
      - name: description
        label: Kısa açıklama
        type: text
      - name: category
        label: Kategori
        type: select
        options:
          placeholder: Kategori seç
          values:
            - name: java
              label: Java
            - name: spring-boot
              label: Spring Boot
            - name: docker
              label: Docker
            - name: genel
              label: Genel
      - name: publishedAt
        label: Tarih
        type: date
        options:
          format: yyyy-MM-dd
      - name: updatedAt
        label: Son düzenleme tarihi
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: tags
        label: Etiketler
        type: string
        list: true
      - name: lang
        label: İçeriğin dili
        type: select
        default: tr
        description: Yazı ya da notun özgün dili. Arayüz dili içerik dilinden bağımsızdır.
        options:
          values:
            - name: tr
              label: Türkçe
            - name: en
              label: English
      - name: published
        label: Yayında
        type: boolean
        default: false
        description: Kapalıysa taslak.
      - name: body
        label: Notun içeriği
        type: rich-text
        options:
          format: markdown
          media: note_images
          switcher: true
  - name: projects
    label: Projeler
    type: collection
    path: src/content/projects
    format: yaml-frontmatter
    filename:
      template: "{fields.urlSlug}.md"
      field: false
    view:
      fields:
        - title
        - published
        - featured
        - status
      primary: title
      sort:
        - order
        - title
    fields:
      - name: title
        label: Proje adı
        type: string
        required: true
      - name: urlSlug
        label: Proje adresi
        type: string
        required: true
        pattern:
          regex: ^[a-z0-9]+(-[a-z0-9]+)*$
          message: Yalnızca küçük harf, rakam ve tire kullan. Örnek not-uygulamasi
        description: Proje /projeler/ADRES/ adresinde açılır.
      - name: tagline
        label: Tek satırlık proje tanımı
        description: Bir dil boşsa diğer dildeki metin gösterilir.
        type: object
        fields:
          - name: tr
            label: Türkçe
            type: text
          - name: en
            label: English
            type: text
      - name: context
        label: Yarışma, ödül veya destek bilgisi
        description: Bir dil boşsa diğer dildeki metin gösterilir.
        type: object
        fields:
          - name: tr
            label: Türkçe
            type: text
          - name: en
            label: English
            type: text
      - name: summary
        label: Kısa açıklama
        type: object
        description: Proje kartında görünen bir iki cümle. Yayınlamak için gerekli.
        fields:
          - name: tr
            label: Türkçe
            type: text
          - name: en
            label: English
            type: text
      - name: highlights
        label: Projeye katkılarım
        description: Her maddeyi ayrı ekle. Sitede Neler yaptım bölümünde gösterilir.
        type: object
        fields:
          - name: tr
            label: Türkçe
            type: text
            list: true
          - name: en
            label: English
            type: text
            list: true
      - name: problem
        label: Çözdüğü problem
        type: object
        fields:
          - name: tr
            label: Türkçe
            type: text
          - name: en
            label: English
            type: text
      - name: benefit
        label: Kullanıcıya sağladığı fayda
        type: object
        fields:
          - name: tr
            label: Türkçe
            type: text
          - name: en
            label: English
            type: text
      - name: role
        label: Projedeki rolüm
        type: object
        fields:
          - name: tr
            label: Türkçe
            type: text
          - name: en
            label: English
            type: text
      - name: technologies
        label: Teknolojiler
        type: string
        list: true
      - name: status
        label: Durum
        type: select
        options:
          placeholder: Durum seç (isteğe bağlı)
          values:
            - name: tamamlandi
              label: Tamamlandı
            - name: gelistiriliyor
              label: Geliştiriliyor
            - name: arsiv
              label: Arşiv
      - name: icon
        label: Kapak yokken gösterilen simge
        type: select
        options:
          placeholder: Simge seç (isteğe bağlı)
          values:
            - name: shield
              label: Güvenlik
            - name: sparkles
              label: Yapay zekâ
            - name: graduation
              label: Eğitim
            - name: trophy
              label: Ödül
            - name: campus
              label: Kampüs
            - name: construction
              label: İnşaat
            - name: document
              label: Doküman
            - name: server
              label: Sunucu
            - name: database
              label: Veritabanı
            - name: layers
              label: Katmanlar
            - name: code
              label: Kod
            - name: globe
              label: Web
            - name: cart
              label: E-ticaret
            - name: chart
              label: Analitik
            - name: mobile
              label: Mobil
            - name: bot
              label: Bot
      - name: color
        label: Proje rengi
        type: select
        options:
          placeholder: Renk seç (isteğe bağlı)
          values:
            - name: blue
              label: Mavi
            - name: purple
              label: Mor
            - name: teal
              label: Turkuaz
            - name: orange
              label: Turuncu
            - name: pink
              label: Pembe
            - name: green
              label: Yeşil
            - name: indigo
              label: İndigo
            - name: red
              label: Kırmızı
      - name: cover
        label: Kapak görseli (ekran görüntüsü)
        type: image
        options:
          media: project_images
      - name: coverAlt
        label: Kapak görselinin açıklaması
        type: object
        fields:
          - name: tr
            label: Türkçe
            type: text
          - name: en
            label: English
            type: text
      - name: gallery
        label: Galeri
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.alt.tr}"
        fields:
          - name: image
            label: Görsel
            type: image
            options:
              media: project_images
            required: true
          - name: alt
            label: Görselin açıklaması
            type: object
            fields:
              - name: tr
                label: Türkçe
                type: text
              - name: en
                label: English
                type: text
      - name: repoUrl
        label: GitHub bağlantısı
        type: string
        pattern:
          regex: ^https?://
          message: Bağlantı https:// ile başlamalı.
      - name: demoUrl
        label: Çalışan demo adresi
        type: string
        description: Demo yoksa boş bırak; sitede çalışmayan düğme gösterilmez.
        pattern:
          regex: ^https?://
          message: Bağlantı https:// ile başlamalı.
      - name: videoUrl
        label: Tanıtım videosu
        type: string
        pattern:
          regex: ^https?://
          message: Bağlantı https:// ile başlamalı.
      - name: startedAt
        label: Başlangıç tarihi
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: endedAt
        label: Bitiş tarihi
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: featured
        label: Öne çıkar
        type: boolean
        default: false
      - name: order
        label: Sıra
        type: number
        description: Küçük sayı önce gösterilir.
      - name: published
        label: Yayında
        type: boolean
        default: false
      - name: body
        label: Ayrıntılı açıklama
        type: rich-text
        options:
          format: markdown
          media: project_images
          switcher: true
  - name: profile
    label: Profil ve İletişim
    type: file
    path: src/data/profile.json
    format: json
    fields:
      - name: name
        label: Ad soyad
        type: string
        required: true
      - name: title
        label: Unvan
        type: object
        required: true
        fields:
          - name: tr
            label: Türkçe
            type: text
          - name: en
            label: English
            type: text
      - name: shortBio
        label: Kısa tanıtım (ana sayfa)
        type: object
        required: true
        fields:
          - name: tr
            label: Türkçe
            type: text
          - name: en
            label: English
            type: text
      - name: bio
        label: Hakkımda metni
        type: object
        required: true
        description: Paragrafları boş bir satırla ayır.
        fields:
          - name: tr
            label: Türkçe
            type: text
          - name: en
            label: English
            type: text
      - name: location
        label: Konum
        type: object
        fields:
          - name: tr
            label: Türkçe
            type: text
          - name: en
            label: English
            type: text
      - name: email
        label: E-posta
        type: string
        description: Sitede herkese açık görünür.
      - name: phone
        label: Telefon
        type: string
        description: Ülke koduyla telefon numarası. Sitede arama bağlantısı olarak gösterilir.
      - name: avatar
        label: Profil fotoğrafı
        type: image
        options:
          media: profile_images
      - name: avatarAlt
        label: Fotoğrafın açıklaması
        type: object
        fields:
          - name: tr
            label: Türkçe
            type: text
          - name: en
            label: English
            type: text
      - name: cv
        label: CV (PDF)
        type: file
        description: Yalnızca herkese açık paylaşmak istediğin bilgileri içeren bir CV yükle.
        options:
          media: cv_files
      - name: education
        label: Eğitim
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.school.tr}"
        fields:
          - name: school
            label: Okul
            type: object
            fields:
              - name: tr
                label: Türkçe
                type: text
              - name: en
                label: English
                type: text
            required: true
          - name: program
            label: Bölüm / program
            type: object
            fields:
              - name: tr
                label: Türkçe
                type: text
              - name: en
                label: English
                type: text
          - name: location
            label: Konum
            description: Bir dil boşsa diğer dildeki metin gösterilir.
            type: object
            fields:
              - name: tr
                label: Türkçe
                type: text
              - name: en
                label: English
                type: text
          - name: period
            label: Dönem
            type: object
            fields:
              - name: tr
                label: Türkçe
                type: text
              - name: en
                label: English
                type: text
      - name: experience
        label: Deneyim
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.role.tr} · {fields.organization.tr}"
        fields:
          - name: role
            label: Görev
            type: object
            fields:
              - name: tr
                label: Türkçe
                type: text
              - name: en
                label: English
                type: text
            required: true
          - name: organization
            label: Kurum
            type: object
            fields:
              - name: tr
                label: Türkçe
                type: text
              - name: en
                label: English
                type: text
            required: true
          - name: location
            label: Konum
            description: Bir dil boşsa diğer dildeki metin gösterilir.
            type: object
            fields:
              - name: tr
                label: Türkçe
                type: text
              - name: en
                label: English
                type: text
          - name: period
            label: Dönem
            type: object
            fields:
              - name: tr
                label: Türkçe
                type: text
              - name: en
                label: English
                type: text
          - name: highlights
            label: Katkılarım ve sorumluluklarım
            description: CV ile uyumlu maddeleri her dil için ayrı ekle.
            type: object
            fields:
              - name: tr
                label: Türkçe
                type: text
                list: true
              - name: en
                label: English
                type: text
                list: true
      - name: skills
        label: Yetenekler
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.group.tr}"
        fields:
          - name: group
            label: Grup adı
            type: object
            fields:
              - name: tr
                label: Türkçe
                type: text
              - name: en
                label: English
                type: text
            required: true
          - name: items
            label: Yetenekler
            type: string
            list: true
      - name: awards
        label: Ödüller ve teknik yazarlık
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title.tr}"
        fields:
          - name: title
            label: Başlık
            description: Bir dil boşsa diğer dildeki metin gösterilir.
            required: true
            type: object
            fields:
              - name: tr
                label: Türkçe
                type: text
              - name: en
                label: English
                type: text
          - name: detail
            label: Ödül / görev
            description: Bir dil boşsa diğer dildeki metin gösterilir.
            type: object
            fields:
              - name: tr
                label: Türkçe
                type: text
              - name: en
                label: English
                type: text
          - name: description
            label: Açıklama
            description: Bir dil boşsa diğer dildeki metin gösterilir.
            type: object
            fields:
              - name: tr
                label: Türkçe
                type: text
              - name: en
                label: English
                type: text
          - name: icon
            label: Simge
            type: select
            options:
              values:
                - name: trophy
                  label: Kupa
                - name: award
                  label: Ödül
                - name: writing
                  label: Yazarlık
      - name: links
        label: Bağlantılar
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - name: label
            label: Görünen ad
            type: string
          - name: url
            label: Adres
            type: string
            pattern:
              regex: ^https?://
              message: Bağlantı https:// ile başlamalı.
          - name: kind
            label: Tür
            type: select
            options:
              values:
                - name: github
                  label: GitHub
                - name: linkedin
                  label: LinkedIn
                - name: medium
                  label: Medium
                - name: youtube
                  label: YouTube
                - name: x
                  label: X
                - name: instagram
                  label: Instagram
                - name: website
                  label: Web sitesi
                - name: diger
                  label: Diğer
      - name: siteDescription
        label: Site açıklaması (arama motorları için)
        type: object
        required: true
        fields:
          - name: tr
            label: Türkçe
            type: text
          - name: en
            label: English
            type: text
      - name: googleSiteVerification
        label: Google Search Console doğrulama kodu
        type: string
        description: Search Console'un verdiği HTML etiketindeki content değeri. Yoksa boş bırak.
  - name: series
    label: Çalışma Serileri
    type: file
    path: src/data/series.json
    format: json
    fields:
      - name: series
        label: Seriler
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title.tr}"
        fields:
          - name: id
            label: Seri kimliği
            type: string
            required: true
            pattern:
              regex: ^[a-z0-9]+(-[a-z0-9]+)*$
              message: Yalnızca küçük harf, rakam ve tire kullan.
          - name: title
            label: Seri adı
            type: object
            required: true
            fields:
              - name: tr
                label: Türkçe
                type: text
              - name: en
                label: English
                type: text
          - name: description
            label: Açıklama
            type: object
            fields:
              - name: tr
                label: Türkçe
                type: text
              - name: en
                label: English
                type: text
          - name: published
            label: Yayında
            type: boolean
            default: false
          - name: chapters
            label: Chapter'lar
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.title.tr}"
            fields:
              - name: title
                label: Chapter adı
                type: object
                fields:
                  - name: tr
                    label: Türkçe
                    type: text
                  - name: en
                    label: English
                    type: text
                required: true
              - name: parts
                label: Part'lar (sırayla)
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{fields.title.tr} {fields.ref}"
                fields:
                  - name: ref
                    label: İçeriğin site adresi
                    type: string
                    description: Örnek /blog/spring-boot-controller/ veya /notlar/yerel/java-interface/
                    required: true
                  - name: title
                    label: Part başlığı (isteğe bağlı)
                    type: object
                    fields:
                      - name: tr
                        label: Türkçe
                        type: text
                      - name: en
                        label: English
                        type: text
  - name: taxonomy
    label: İçerik kategorileri
    type: file
    path: src/data/taxonomy.json
    format: json
    fields:
      - name: categories
        label: Kategoriler
        type: object
        description: Kategori kimliği, Makaleler ve Öğrenme Notları kategori seçenekleriyle aynı olmalıdır.
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{fields.label.tr} ({fields.id})"
        fields:
          - name: id
            label: Kategori kimliği
            type: string
            required: true
            pattern:
              regex: ^[a-z0-9]+(-[a-z0-9]+)*$
              message: Yalnızca küçük harf, rakam ve tire kullan.
            description: Yayınlanmış yazıların ve notların category değeriyle eşleşir. Kullanımdaki kimliği değiştirme.
          - name: label
            label: Görünen kategori adı
            description: Bir dil boşsa diğer dildeki metin gösterilir.
            required: true
            type: object
            fields:
              - name: tr
                label: Türkçe
                type: text
              - name: en
                label: English
                type: text
          - name: description
            label: Kategori açıklaması
            description: Bir dil boşsa diğer dildeki metin gösterilir.
            type: object
            fields:
              - name: tr
